services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://voiceaura:voiceaura@postgres:5432/voiceaura
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./api:/app
      - ./providers:/app/providers
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voiceaura
      POSTGRES_PASSWORD: voiceaura
      POSTGRES_DB: voiceaura
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
